# declare services
services:
  - type: web
    name: online-voting
    runtime: node
    plan: standard
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://online-voting.onrender.com
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: e_voting
          property: connectionString

databases:
  - name: e_voting
    databaseName: e_voting
    plan: standard
    postgresMajorVersion: "15"
