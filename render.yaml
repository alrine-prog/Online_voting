services:
  - type: web
    name: online-voting
    plan: standard
    
    # Build configuration
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        scope: build
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://online-voting.onrender.com
      - key: PORT
        value: 3000

  - type: pserv
    name: online-voting-db
    plan: standard
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
    
    # PostgreSQL environment
    database:
      name: e_voting
      user: postgres
      version: "15"
      
databases:
  - name: e_voting
    databaseName: e_voting
    user: postgres
    postgresMajorVersion: "15"
    plan: standard
