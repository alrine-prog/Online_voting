version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: e-voting-db
    environment:
      POSTGRES_DB: e_voting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - e-voting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-voting-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/e_voting
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: development
      PORT: 3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e-voting-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run prisma:migrate:deploy && npm run prisma:seed && npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  e-voting-network:
    driver: bridge
